# A `<crate>/v<version>` tag (pushed by release.yml after a release PR is
# merged) gets its GitHub release, created with gh. An `lsdocs/v*` release
# is the repository's latest and has the `lsdocs` binaries attached, as
# cargo-binstall expects (see crates/cli/Cargo.toml).
name: Tag

on:
  push:
    tags: ["*/v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lsdocs/.github/.github/create-release@main
        with:
          latest: ${{ startsWith(github.ref_name, 'lsdocs/v') }}

  build:
    if: startsWith(github.ref_name, 'lsdocs/v')
    uses: lsdocs/.github/.github/workflows/build-bin.yml@main
    permissions:
      contents: read
    with:
      package: lsdocs

  upload:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

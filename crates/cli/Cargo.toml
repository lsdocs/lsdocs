[package]
name = "lsdocs"
description = "The lsdocs command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lsdocs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
lsdocs-config.workspace = true
lsdocs-host.workspace = true
lsdocs-parser-markdown.workspace = true
lsdocs-parser-rst.workspace = true
lsdocs-plugin-sdk.workspace = true
lsdocs-render-html.workspace = true
lsdocs-transform-highlight.workspace = true
lsdocs-transform-links.workspace = true
lsdocs-sphinx-addons.workspace = true
lsdocs-apidoc-python = { workspace = true, optional = true }
lsdocs-apidoc-typescript = { workspace = true, optional = true }
lsdocs-apidoc-rust = { workspace = true, optional = true }
lsdocs-apidoc-clang = { workspace = true, optional = true }
lsdocs-transform-nav.workspace = true
lsdocs-transform-toc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[features]
# The API documentation builtins. `apidoc-python` and `apidoc-typescript`
# raise the MSRV to their plugins' (1.97); without them lsdocs builds on
# the workspace's.
default = ["apidoc-clang", "apidoc-python", "apidoc-rust", "apidoc-typescript"]
apidoc-python = ["dep:lsdocs-apidoc-python"]
apidoc-typescript = ["dep:lsdocs-apidoc-typescript"]
# Needs no more than the workspace's MSRV; using it needs a nightly
# toolchain installed (rustdoc's JSON).
apidoc-rust = ["dep:lsdocs-apidoc-rust"]
# `apidoc-c` and `apidoc-cpp`. Needs no more than the workspace's MSRV,
# and no LLVM to build; using them needs libclang installed.
apidoc-clang = ["dep:lsdocs-apidoc-clang"]

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true

[package]
name = "lsdocs-host"
description = "Plugin registry, supervision, build pipeline and cache."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
globset.workspace = true
lsdocs-config.workspace = true
lsdocs-plugin-sdk.workspace = true
lsdocs-protocol.workspace = true
lsdocs-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "process", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
